name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Grant execute permission for gradlew
        run: chmod +x frontend/android/gradlew

      - name: Copy Web Assets to Android
        run: |
          mkdir -p frontend/android/app/src/main/assets/public
          cp -rf frontend/dist/* frontend/android/app/src/main/assets/public/
          cp -f frontend/capacitor.config.json frontend/android/app/src/main/assets/capacitor.config.json

      - name: Build Android APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seuljjeock-app-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
